[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "horus"
version = "0.1.0"
description = "Local image generation as an MCP server: list, install and run image styles on your own GPU."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.3.0"]

[project.scripts]
horus-mcp = "horus.server:main"

[tool.setuptools]
packages = ["horus"]
