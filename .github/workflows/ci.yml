name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: go ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the frozen suite step reads the base commit of the pull request (HEAD^1)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o bin/ ./cmd/horus
      - run: go vet ./...
      - name: Each goal suite compiles (no goal row runs)
        run: go vet -tags goal ./goals/...
      - run: go test ./...
      - name: gofmt prints nothing
        if: matrix.goos == 'linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: lint-public finds nothing
        if: matrix.goos == 'linux'
        run: python3 scripts/lint-public.py
      - name: No change to a frozen goal suite
        if: matrix.goos == 'linux' && github.event_name == 'pull_request'
        run: python3 scripts/frozen-suites.py --base HEAD^1

  postgres:
    # internal/postgres, the contract suites of internal/brokertest and horus worker on a real Postgres (ADR 0026, ADR 0033, ADR 0037).
    # The tests skip without HORUS_TEST_DATABASE_URL, so the last step fails when a test skipped.
    # The service container is only for this job: it trusts each connection, so no password is in this file.
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HORUS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The Postgres adapter and the contract suites on Postgres 18.6
        shell: bash
        run: go test -count=1 -v ./internal/postgres/... ./internal/brokertest/... | tee postgres.log
      - name: horus worker on Postgres 18.6 (the tests TestWorker* of cmd/horus)
        shell: bash
        run: go test -count=1 -v -run '^TestWorker' ./cmd/horus | tee -a postgres.log
      - name: No test skipped, and both brokers, both job stores and the worker passed
        shell: bash
        run: |
          if grep -E -- '--- SKIP' postgres.log; then echo "a test skipped"; exit 1; fi
          for t in TestMemoryBroker TestPostgresBroker TestMemoryStore TestPostgresStore TestWorkerOnPostgres TestWorkerTakesTheLockAgain; do
            grep -E -- "^--- PASS: $t " postgres.log || { echo "$t did not pass"; exit 1; }
          done

  contract:
    # A goal suite can read the jobs whose name starts with "contract" and has the system name.
    name: contract ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: go build -o bin/ ./cmd/horus
      - name: Contract test against the Go binary
        shell: bash
        run: |
          python tests/mcp_contract.py --server-cmd "$GITHUB_WORKSPACE/bin/horus${{ runner.os == 'Windows' && '.exe' || '' }}" mcp | tee contract.log
          grep -q "contract: 62 of 62 passed" contract.log

  workflow-parity:
    # tests/workflow_parity.py: horus workflow against the golden files recorded from the old script.
    name: workflow-parity ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: go build -o bin/ ./cmd/horus
      - name: Parity of horus workflow
        shell: bash
        run: |
          python tests/workflow_parity.py --horus "bin/horus${{ runner.os == 'Windows' && '.exe' || '' }}" | tee parity.log
          grep -q "parity: 17 of 17 cases equal" parity.log

  release-build:
    # The same build script as the release job, with no upload. A goal suite can read this job name.
    name: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the release assets with the version 0.0.0-ci
        run: bash scripts/build-release.sh 0.0.0-ci release-assets
      - name: The folder has exactly 3 files and the checksums are right
        working-directory: release-assets
        run: |
          test "$(ls | wc -l)" -eq 3
          ls horus-windows-amd64.exe horus-darwin-arm64 checksums.txt
          test "$(wc -l < checksums.txt)" -eq 2
          sha256sum -c checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  install:
    # A goal suite can read the jobs "install windows-latest" and "install macos-latest".
    # The job runs the install script by the pipe of the install line. A local server
    # (python -m http.server) gives the release files of job release-build, so the test
    # reaches no real release.
    name: install ${{ matrix.os }}
    needs: release-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Windows, serve the release files
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $good = Join-Path $env:RUNNER_TEMP 'release-assets'
          $bad = Join-Path $env:RUNNER_TEMP 'release-bad'
          New-Item -ItemType Directory -Path $bad | Out-Null
          Copy-Item "$good\*" $bad
          # The first character of each checksum is changed (0 becomes 1, any other becomes 0). So each checksum is wrong in the folder "release-bad".
          (Get-Content "$good\checksums.txt") | ForEach-Object { $(if ($_[0] -eq '0') { '1' } else { '0' }) + $_.Substring(1) } | Set-Content -Encoding ascii "$bad\checksums.txt"
          Start-Process python -ArgumentList '-m','http.server','8081','--bind','127.0.0.1' -WorkingDirectory $good -WindowStyle Hidden
          Start-Process python -ArgumentList '-m','http.server','8082','--bind','127.0.0.1' -WorkingDirectory $bad -WindowStyle Hidden
          Start-Sleep -Seconds 3
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8081/checksums.txt | Out-Null
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8082/checksums.txt | Out-Null

      - name: Windows, install by the pipe of the install line
        if: runner.os == 'Windows'
        shell: powershell
        env:
          HORUS_INSTALL_BASE_URL: http://127.0.0.1:8081
        run: |
          powershell -NoProfile -Command "Get-Content -Raw install.ps1 | iex"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exit code $LASTEXITCODE" }

      - name: Windows, a new shell finds horus on the PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # A new shell starts with the PATH of the registry, not with the PATH of this step.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          Set-Location $env:RUNNER_TEMP
          Write-Host "folder: $(Get-Location)"
          (Get-Command horus).Source
          $v = horus version
          $v
          if ($v -ne 'horus 0.0.0-ci') { throw "wrong version: $v" }
          $list = horus workflow list
          $list
          if (-not ($list | Select-String 'it-illustration')) { throw 'horus workflow list has no it-illustration' }

      - name: Windows, a wrong checksum installs nothing
        if: runner.os == 'Windows'
        shell: powershell
        env:
          HORUS_INSTALL_BASE_URL: http://127.0.0.1:8082
          HORUS_INSTALL_NO_PATH: "1"
        run: |
          $env:HORUS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bad-install'
          powershell -NoProfile -Command "Get-Content -Raw install.ps1 | iex"
          $code = $LASTEXITCODE
          Write-Host "exit code: $code"
          if ($code -eq 0) { throw 'the script accepted a wrong SHA-256' }
          if ((Test-Path $env:HORUS_INSTALL_DIR) -and (Get-ChildItem $env:HORUS_INSTALL_DIR)) { throw 'the folder is not empty' }
          Write-Host 'the folder is empty'
          # The step must not end with the exit code of the script that failed on purpose.
          exit 0

      - name: Windows, a second run updates the program
        if: runner.os == 'Windows'
        shell: powershell
        env:
          HORUS_INSTALL_BASE_URL: http://127.0.0.1:8081
        run: |
          powershell -NoProfile -Command "Get-Content -Raw install.ps1 | iex"
          if ($LASTEXITCODE -ne 0) { throw "second run: exit code $LASTEXITCODE" }
          $n = ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -like '*Programs\horus' }).Count
          if ($n -ne 1) { throw "the PATH has $n entries of horus" }
          & (Join-Path $env:LOCALAPPDATA 'Programs\horus\horus.exe') version

      - name: Windows, horus uninstall -yes removes the program and the PATH entry
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\horus\horus.exe'
          Set-Location $env:RUNNER_TEMP
          & $exe uninstall
          if ($LASTEXITCODE -ne 0) { throw "horus uninstall (the plan): exit code $LASTEXITCODE" }
          & $exe uninstall -yes
          if ($LASTEXITCODE -ne 0) { throw "horus uninstall -yes: exit code $LASTEXITCODE" }
          # On Windows the program file goes a moment after the end of the program.
          for ($i = 0; ($i -lt 50) -and (Test-Path $exe); $i++) { Start-Sleep -Milliseconds 200 }
          if (Test-Path $exe) { throw "the program file is still there after 10 s: $exe" }
          Write-Host 'the program file is gone'

      - name: Windows, a new shell does not find horus
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # A new shell starts with the PATH of the registry, not with the PATH of this step.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $n = ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -like '*Programs\horus' }).Count
          if ($n -ne 0) { throw "the PATH still has $n entries of horus" }
          if (Get-Command horus -ErrorAction SilentlyContinue) { throw "a new shell finds horus: $((Get-Command horus).Source)" }
          Write-Host 'a new shell does not find horus'

      - name: macOS, serve the release files
        if: runner.os == 'macOS'
        run: |
          good="$RUNNER_TEMP/release-assets"
          bad="$RUNNER_TEMP/release-bad"
          mkdir "$bad"
          cp "$good"/* "$bad"/
          # The first character of each checksum is changed (0 becomes 1, any other becomes 0). So each checksum is wrong in the folder "release-bad".
          awk '{ c = substr($0, 1, 1); print (c == "0" ? "1" : "0") substr($0, 2) }' "$good/checksums.txt" > "$bad/checksums.txt"
          (cd "$good" && nohup python -m http.server 8081 --bind 127.0.0.1 >/dev/null 2>&1 &)
          (cd "$bad" && nohup python -m http.server 8082 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 3
          curl -fsS http://127.0.0.1:8081/checksums.txt >/dev/null
          curl -fsS http://127.0.0.1:8082/checksums.txt >/dev/null

      - name: macOS, install by the pipe of the install line
        if: runner.os == 'macOS'
        env:
          HORUS_INSTALL_BASE_URL: http://127.0.0.1:8081
          SHELL: /bin/zsh
        run: |
          # The runner has ~/.local/bin on its PATH. A clean PATH makes the script write the profile.
          cat install.sh | env PATH=/usr/bin:/bin:/usr/sbin:/sbin sh
          echo "--- the profile:"
          cat "$HOME/.zprofile"

      - name: macOS, a new shell finds horus on the PATH
        if: runner.os == 'macOS'
        run: |
          # "env -i" gives a shell with no PATH of this step. "zsh -l" reads ~/.zprofile.
          cd "$RUNNER_TEMP"
          pwd
          env -i HOME="$HOME" /bin/zsh -l -c 'command -v horus; horus version' | tee new-shell.log
          grep -qx 'horus 0.0.0-ci' new-shell.log
          env -i HOME="$HOME" /bin/zsh -l -c 'horus workflow list' | tee list.log
          grep -q it-illustration list.log

      - name: macOS, a wrong checksum installs nothing
        if: runner.os == 'macOS'
        env:
          HORUS_INSTALL_BASE_URL: http://127.0.0.1:8082
          HORUS_INSTALL_NO_PATH: "1"
        run: |
          export HORUS_INSTALL_DIR="$RUNNER_TEMP/bad-install"
          if cat install.sh | sh; then
            echo "the script accepted a wrong SHA-256"
            exit 1
          fi
          if [ -d "$HORUS_INSTALL_DIR" ] && [ -n "$(ls -A "$HORUS_INSTALL_DIR")" ]; then
            echo "the folder is not empty"
            exit 1
          fi
          echo "the folder is empty"

      - name: macOS, a second run updates the program
        if: runner.os == 'macOS'
        env:
          HORUS_INSTALL_BASE_URL: http://127.0.0.1:8081
          SHELL: /bin/zsh
        run: |
          cat install.sh | env PATH=/usr/bin:/bin:/usr/sbin:/sbin sh
          test "$(grep -c 'added by the horus installer' "$HOME/.zprofile")" -eq 1
          "$HOME/.local/bin/horus" version

      - name: macOS, horus uninstall -yes removes the program and the profile line
        if: runner.os == 'macOS'
        run: |
          cd "$RUNNER_TEMP"
          "$HOME/.local/bin/horus" uninstall
          "$HOME/.local/bin/horus" uninstall -yes
          if [ -e "$HOME/.local/bin/horus" ]; then echo "the program file is still there"; exit 1; fi
          if grep -q 'added by the horus installer' "$HOME/.zprofile"; then echo "the profile still has the line"; exit 1; fi
          echo "the program file and the profile line are gone"

      - name: macOS, a new shell does not find horus
        if: runner.os == 'macOS'
        run: |
          # "env -i" gives a shell with no PATH of this step. "zsh -l" reads ~/.zprofile.
          if env -i HOME="$HOME" /bin/zsh -l -c 'command -v horus'; then echo "a new shell finds horus"; exit 1; fi
          echo "a new shell does not find horus"
