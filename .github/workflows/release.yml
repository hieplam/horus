name: release

# Job release-please keeps one pull request open with the next version. When
# somebody merges that pull request, the job makes the tag and the GitHub
# Release. Job upload runs only then: it builds the two programs and uploads
# them with checksums.txt to the release.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be on, or job release-please fails (task T10 of the epic).

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the programs and checksums.txt
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/build-release.sh "${TAG#v}" release-assets
      - name: Upload the 3 assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber
